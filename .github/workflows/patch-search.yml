name: Patch search (one-off)

on:
  push:
    paths:
      - .github/workflows/patch-search.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch to index.html
        run: python3 tools/patch_search.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "feat(search): any-place geocoding via OSM Photon"
            git push
          fi

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
