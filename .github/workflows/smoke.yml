name: smoke test

on:
  push:
    paths:
      - "tools/refresh_cafes.py"
      - "tools/refresh_facilities.py"
      - "tools/health_check.py"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m py_compile tools/*.py
      - name: Cafe refresh dry-run
        run: python tools/refresh_cafes.py --dry-run
