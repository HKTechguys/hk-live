<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<title>香港即時 · 掃一下</title>
<style>
  :root{
    --ink:#eaf6f5; --dim:#8fa3ad; --line:rgba(120,200,190,.18);
    --bg:#0b1016; --card:#111a22; --teal:#54d8c4; --amber:#f0b45a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  .wind{position:fixed; inset:-20% -50%; pointer-events:none; opacity:.22; z-index:0;
    background:repeating-linear-gradient(115deg,
      rgba(84,216,196,.0) 0 26px, rgba(84,216,196,.55) 26px 27px, rgba(84,216,196,0) 27px 96px);
    animation:blow 9s linear infinite;}
  @keyframes blow{from{transform:translate3d(0,0,0)}to{transform:translate3d(-96px,40px,0)}}
  @media (prefers-reduced-motion:reduce){.wind{animation:none}}
  .wrap{position:relative; z-index:1; width:100%; max-width:460px; margin:0 auto; padding:22px 18px 34px}
  .brand{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.24em;
    color:var(--dim); text-transform:uppercase}
  .brand b{color:var(--teal); font-weight:600; letter-spacing:.24em}
  .hist{font-size:11px; color:var(--dim); margin-top:7px; letter-spacing:.03em}
  .geo{margin-top:11px; font-size:13px; color:#cfdcdd}
  .geo .near{display:block}
  .geo .also{display:block; font-size:12px; color:var(--dim); margin-top:5px}
  .gbtn{font:inherit; font-size:12px; color:var(--teal); background:rgba(84,216,196,.08);
    border:1px solid rgba(84,216,196,.4); border-radius:999px; padding:7px 13px; cursor:pointer}
  .hero{margin:16px 0 0}
  .now{font-size:13px; color:var(--dim)}
  .temp{display:flex; align-items:baseline; gap:6px; margin:6px 0 2px}
  .temp .n{font-size:64px; line-height:1; font-weight:600; letter-spacing:-.02em}
  .temp .u{font-size:15px; color:var(--dim)}
  .sub{font-size:13px; color:var(--dim)}
  .desc{font-size:14px; line-height:1.55; margin-top:10px; color:#cfdcdd}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px}
  .k{font-size:11px; color:var(--dim); letter-spacing:.12em}
  .holiday .days{display:flex; align-items:baseline; gap:6px; margin-top:8px}
  .holiday .days .n{font-size:46px; font-weight:600; color:var(--teal); line-height:1}
  .holiday .days .u{font-size:13px; color:var(--dim)}
  .holiday .nm{font-size:17px; margin-top:8px}
  .holiday .dt{font-size:12px; color:var(--dim); margin-top:3px}
  .rain{margin-top:14px}
  .rain .row{display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px dashed var(--line)}
  .rain .row:last-child{border:0}
  .rain .mm{color:var(--teal)}
  .ok{color:var(--dim); font-size:13px}
  .days5{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-top:12px; scrollbar-width:none}
  .days5::-webkit-scrollbar{display:none}
  .d{min-width:86px; background:rgba(255,255,255,.03); border:1px solid var(--line);
    border-radius:12px; padding:10px 9px; flex:0 0 auto}
  .d .w{font-size:11px; color:var(--dim)}
  .d .dd{font-size:15px; margin-top:3px}
  .d .t{font-size:12px; color:var(--teal); margin-top:6px}
  .d .p{font-size:11px; color:var(--dim); margin-top:4px}
  .foot{margin-top:22px; font-size:11px; color:var(--dim); line-height:1.7}
  .foot a{color:var(--dim)}
  .banner{display:none; margin:0 0 14px; padding:13px 14px; border-radius:14px;
    font-size:14px; line-height:1.5; font-weight:600; letter-spacing:.02em;
    background:rgba(240,180,90,.14); border:1px solid rgba(240,180,90,.45); color:#ffdda8}
  body[data-lv="2"]{--teal:#f7c15e}
  body[data-lv="2"] .banner{display:block; background:rgba(247,193,94,.16);
    border-color:rgba(247,193,94,.5); color:#ffe3ad}
  body[data-lv="3"]{--teal:#ff7b7b}
  body[data-lv="3"] .banner{display:block;
    background:linear-gradient(180deg,rgba(255,86,86,.30),rgba(255,86,86,.12));
    border-color:rgba(255,110,110,.6); color:#ffdede}
  body[data-lv="3"] .card{border-color:rgba(255,120,120,.35)}
  .krow{display:flex; align-items:center; gap:8px}
  .rsw{margin-left:auto; display:flex; gap:6px}
  .rsw button{font:inherit; font-size:11px; color:var(--dim); background:rgba(255,255,255,.05);
    border:1px solid var(--line); border-radius:8px; padding:4px 9px; cursor:pointer}
  .rsw button[aria-pressed="true"]{color:var(--teal); border-color:var(--teal)}
  .shot{position:relative; margin-top:10px; padding-top:100%;
    overflow:hidden; border-radius:12px; background:#04121a}
  .shot img{position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:left center}
  body[data-lv="2"] .holiday .days .n,body[data-lv="3"] .holiday .days .n{color:var(--ink)}
</style>
</head>
<body>
<div class="wind"></div>
<div class="wrap">
  <div class="banner" id="banner"></div>
  <div class="brand">AI PASSPORT <b>· NFC 快掃</b></div>
  <div class="hist" id="hist"></div>

  <div class="hero">
    <div class="now" id="now">香港天文台</div>
    <div class="temp"><span class="n" id="temp">--</span><span class="u">°C</span></div>
    <div class="sub" id="sub">濕度 -- · 更新 --</div>
    <div class="desc" id="desc"></div>
    <div class="geo" id="geo"></div>
  </div>

  <div class="card holiday">
    <div class="k">下一個公眾假期</div>
    <div class="days"><span class="n" id="hd">--</span><span class="u">日後</span></div>
    <div class="nm" id="hn">--</div>
    <div class="dt" id="hdt"></div>
  </div>

  <div class="card rain">
    <div class="k">過去一小時雨量</div>
    <div id="rain" class="ok">讀取中…</div>
  </div>

  <div class="card radar">
    <div class="krow">
      <div class="k">雷達雨區</div>
      <div class="rsw">
        <button id="r128" aria-pressed="true">128km</button>
        <button id="r256" aria-pressed="false">256km</button>
      </div>
    </div>
    <div class="shot"><img id="radarimg" alt="香港天文台雷達雨區圖" referrerpolicy="no-referrer"></div>
    <div class="ok" id="radartime" style="margin-top:9px">讀取中…</div>
  </div>

  <div class="card">
    <div class="k">未來幾日</div>
    <div class="days5" id="fnd"></div>
  </div>

  <div class="foot" id="foot">
    資料來源：香港天文台（每 5 分鐘自動更新）· 假期：1823<br>
    離線時顯示上一次讀到嘅數值。
  </div>
</div>

<script>
const HOL = [{"d": "2026-12-25", "n": "聖誕節"}, {"d": "2026-12-26", "n": "聖誕節後第一個周日"}, {"d": "2027-01-01", "n": "一月一日"}, {"d": "2027-02-06", "n": "農曆年初一"}, {"d": "2027-02-08", "n": "農曆年初三"}, {"d": "2027-02-09", "n": "農曆年初四"}, {"d": "2027-03-26", "n": "耶穌受難節"}, {"d": "2027-03-27", "n": "耶穌受難節翌日"}, {"d": "2027-03-29", "n": "復活節星期一"}, {"d": "2027-04-05", "n": "清明節"}, {"d": "2027-05-01", "n": "勞動節"}, {"d": "2027-05-13", "n": "佛誕"}, {"d": "2027-06-09", "n": "端午節"}, {"d": "2027-07-01", "n": "香港特別行政區成立紀念日"}, {"d": "2027-09-16", "n": "中秋節翌日"}, {"d": "2027-10-01", "n": "國慶日"}, {"d": "2027-10-08", "n": "重陽節"}, {"d": "2027-12-25", "n": "聖誕節"}, {"d": "2027-12-27", "n": "聖誕節後第一個周日"}];

function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

(function(){
  const t = new Date(); t.setHours(0,0,0,0);
  const next = HOL.find(h => new Date(h.d+"T00:00:00") >= t);
  if(!next) return;
  const d = new Date(next.d+"T00:00:00");
  const days = Math.round((d - t)/86400000);
  document.getElementById("hd").textContent = days;
  document.getElementById("hn").textContent = next.n;
  document.getElementById("hdt").textContent =
    (d.getMonth()+1)+"月"+d.getDate()+"日 · "+WD[d.getDay()]+"（今日起 "+days+" 日）";
  window.__hol = {n: next.n, days: days};
  updateTitle();
  if(days===0) document.getElementById("hd").textContent = "今";
})();

let scan = {count:0, day:"", dayCount:0, last:0};
try{ const raw = localStorage.getItem("hk_scan"); if(raw) scan = JSON.parse(raw) || scan; }catch(e){}
(function(){
  const now = new Date();
  const today = ymd(now);
  scan.dayCount = (scan.day === today) ? (scan.dayCount||0) : 0;
  scan.day = today;
  scan.count = (scan.count||0) + 1;
  scan.dayCount++;
  const prev = scan.last;
  scan.last = now.getTime();
  try{ localStorage.setItem("hk_scan", JSON.stringify(scan)); }catch(e){}
  const el = document.getElementById("hist");
  if(!prev){ el.textContent = "第一次掃呢張貼紙 · 共 1 次"; return; }
  const p = new Date(prev);
  const days = Math.floor((now - p)/86400000);
  const ago = days <= 0 ? pad(p.getHours())+":"+pad(p.getMinutes())
            : days === 1 ? "昨日"
            : (p.getMonth()+1)+"月"+p.getDate()+"日";
  el.textContent = "今日第 "+scan.dayCount+" 次 · 上次 "+ago+" · 共 "+scan.count+" 次";
})();

function updateTitle(){
  const t = document.getElementById("temp").textContent;
  const h = window.__hol;
  if(t && t !== "--") document.title = t+"°C · "+(h ? h.n+" 仲有 "+h.days+" 日" : "香港即時");
}

// ---- 位置感知:搵最近嘅氣溫站 ----
const STA = [
  {n:"京士柏",la:22.312,lo:114.173},{n:"香港天文台",la:22.302,lo:114.174},
  {n:"黃竹坑",la:22.248,lo:114.170},{n:"打鼓嶺",la:22.545,lo:114.152},
  {n:"流浮山",la:22.469,lo:113.984},{n:"大埔",la:22.448,lo:114.170},
  {n:"沙田",la:22.387,lo:114.188},{n:"屯門",la:22.390,lo:113.972},
  {n:"將軍澳",la:22.318,lo:114.270},{n:"西貢",la:22.383,lo:114.275},
  {n:"長洲",la:22.201,lo:114.027},{n:"赤鱲角",la:22.309,lo:113.914},
  {n:"青衣",la:22.348,lo:114.100},{n:"石崗",la:22.436,lo:114.083},
  {n:"荃灣可觀",la:22.375,lo:114.113},{n:"荃灣城門谷",la:22.383,lo:114.130},
  {n:"香港公園",la:22.278,lo:114.160},{n:"筲箕灣",la:22.282,lo:114.230},
  {n:"九龍城",la:22.328,lo:114.187},{n:"跑馬地",la:22.270,lo:114.180},
  {n:"黃大仙",la:22.340,lo:114.196},{n:"赤柱",la:22.216,lo:114.219},
  {n:"觀塘",la:22.318,lo:114.222},{n:"深水埗",la:22.333,lo:114.160},
  {n:"啟德跑道公園",la:22.305,lo:114.212},{n:"元朗公園",la:22.440,lo:114.030},
  {n:"大美督",la:22.466,lo:114.240}
];
let geoPos = null;
function haversine(la1,lo1,la2,lo2){
  const R = 6371, r = Math.PI/180;
  const dLa = (la2-la1)*r, dLo = (lo2-lo1)*r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function renderGeo(){
  const el = document.getElementById("geo");
  if(!geoPos){
    el.innerHTML = '<button class="gbtn" id="geobtn">用我位置睇附近氣溫</button>';
    document.getElementById("geobtn").addEventListener("click", askGeo);
    return;
  }
  const rows = (window.__temps||[]).map(t=>{
    const s = STA.find(x=>x.n===t.place);
    return s ? {p:t.place, v:t.value, d:haversine(geoPos.lat, geoPos.lon, s.la, s.lo)} : null;
  }).filter(Boolean).sort((a,b)=>a.d-b.d);
  if(!rows.length){ el.innerHTML = '<span class="also">附近氣溫暫時讀唔到，等一陣再掃</span>'; return; }
  const main = rows[0], rest = rows.slice(1,3);
  el.innerHTML = '<span class="near">你附近 <b>'+main.p+' '+main.v+'°C</b> · '+
    main.d.toFixed(1)+' km</span><span class="also">亦近：'+
    rest.map(r=>r.p+' '+r.v+'°').join(' · ')+'</span>';
}
function askGeo(){
  const el = document.getElementById("geo");
  if(!navigator.geolocation){ el.innerHTML = '<span class="also">部機唔支援定位</span>'; return; }
  el.innerHTML = '<span class="also">定位中…</span>';
  navigator.geolocation.getCurrentPosition(
    p=>{ geoPos = {lat:p.coords.latitude, lon:p.coords.longitude}; renderGeo(); },
    ()=>{ el.innerHTML = '<span class="also">唔開得定位 — 照睇天文台總部嘅數</span>'
      + '<br><button class="gbtn" id="geobtn">再試一次</button>';
      document.getElementById("geobtn").addEventListener("click", askGeo); },
    {timeout:8000, maximumAge:600000}
  );
}
renderGeo();
if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:"geolocation"})
    .then(s=>{ if(s.state==="granted") askGeo(); }).catch(()=>{});
}

const URL_NOW = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc";
const FND = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc";

function setText(id, s){ document.getElementById(id).textContent = s }

function renderNow(j){
  const temps = (j.temperature && j.temperature.data) || [];
  const pick = temps.find(x => x.place === "香港天文台") || temps[0];
  if(pick) setText("temp", pick.value);
  window.__temps = temps;
  if(geoPos) renderGeo();
  updateTitle();
  if(!window.__buzzed && navigator.vibrate){
    window.__buzzed = true;
    try{ navigator.vibrate(30); }catch(e){}
  }
  const hum = (j.humidity && j.humidity.data && j.humidity.data[0]) || null;
  let s = "濕度 " + (hum ? hum.value + "%" : "--");
  const up = (j.updateTime||"").slice(11,16);
  window.__nowUp = up;
  if(up) s += " · 更新 " + up;
  setText("sub", s);
  updateFoot();
  applyWarn((j.warningMessage||"").trim());

  const rf = (j.rainfall && j.rainfall.data) || [];
  const hit = rf.filter(x => typeof x.max === "number" && x.max > 0)
                .sort((a,b)=>b.max-a.max).slice(0,6);
  const el = document.getElementById("rain");
  const today = j.rainfallFrom00To12;
  const tline = (typeof today === "number" && today > 0) ? "今日 00–12 時累計 "+today+" mm" : "";
  if(!rf.length){ el.className="ok"; el.textContent="今次讀唔到雨量資料"; }
  else if(!hit.length){ el.className="ok"; el.textContent="過去一小時各區都冇錄得雨量" + (tline?" · "+tline:""); }
  else{
    el.className="";
    el.innerHTML = hit.map(x=>'<div class="row"><span>'+x.place+'</span><span class="mm">'+x.max+' mm</span></div>').join("");
  }
}

function renderFnd(j){
  const list = (j.weatherForecast||[]).slice(0,5);
  if(list[0]){
    const tmin = list[0].forecastMintemp ? list[0].forecastMintemp.value : null;
    const tmax = list[0].forecastMaxtemp ? list[0].forecastMaxtemp.value : null;
    const rng = (tmin!==null && tmax!==null) ? "（今日 "+tmin+"–"+tmax+"°C）" : "";
    document.getElementById("desc").textContent = (list[0].forecastWeather||"") + rng;
  }
  window.__fndUp = (j.updateTime||"").slice(11,16);
  updateFoot();
  const wrap = document.getElementById("fnd");
  wrap.innerHTML = list.map(f=>{
    const ds = f.forecastDate;
    const d = new Date(ds.slice(0,4)+"-"+ds.slice(4,6)+"-"+ds.slice(6,8)+"T00:00:00");
    const t = (f.forecastMintemp?f.forecastMintemp.value:"?")+"–"+(f.forecastMaxtemp?f.forecastMaxtemp.value:"?")+"°";
    return '<div class="d"><div class="w">'+WD[d.getDay()]+'</div><div class="dd">'
      + (d.getMonth()+1)+'/'+d.getDate()+'</div><div class="t">'+t
      + '</div><div class="p">雨 '+(f.PSR||"—")+'</div></div>';
  }).join("");
}

function updateFoot(){
  const up = window.__nowUp || window.__fndUp || "";
  document.getElementById("foot").innerHTML =
    "資料來源：香港天文台（"+(up?"更新 "+up+"，":"")+"每 5 分鐘自動重讀）· 假期：1823<br>離線時顯示上一次讀到嘅數值。";
}

const WLV = [
  {lv:3, re:/(十號|九號|八號|黑色暴雨)/},
  {lv:2, re:/(三號|紅色暴雨|海嘯)/},
  {lv:1, re:/(一號|黃色暴雨|雷暴|季候風|酷熱|寒冷|霜凍|火災|山泥傾瀉|霜|結冰)/}
];
function applyWarn(msg){
  const box = document.getElementById("banner");
  if(!msg){ box.style.display="none"; document.body.removeAttribute("data-lv"); return; }
  const hit = WLV.find(w => w.re.test(msg));
  document.body.dataset.lv = hit ? hit.lv : 1;
  box.textContent = msg.replace(/。$/,"");
  box.style.display = "block";
}

const RAD = {
  "128": {dir:"rad_128_png", pre:"2d128nradar_"},
  "256": {dir:"rad_256_png", pre:"2d256nradar_"}
};
let radRange = "128";
document.getElementById("r128").addEventListener("click", () => setRange("128"));
document.getElementById("r256").addEventListener("click", () => setRange("256"));
function setRange(r){
  radRange = r;
  document.getElementById("r128").setAttribute("aria-pressed", r==="128");
  document.getElementById("r256").setAttribute("aria-pressed", r==="256");
  loadRadar();
}
function stamp(d){
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes());
}
function loadRadar(){
  const cfg = RAD[radRange];
  const img = document.getElementById("radarimg");
  const lab = document.getElementById("radartime");
  const base = new Date();
  base.setMinutes(base.getMinutes() - base.getMinutes()%6);
  base.setSeconds(0,0);
  let i = 0;
  lab.textContent = "讀取中…";
  function tick(){
    if(i > 9){ lab.textContent = "雷達圖暫時讀唔到，第 6 分鐘再試"; return; }
    const t = new Date(base.getTime() - i*6*60000);
    i++;
    img.onerror = tick;
    img.onload = () => {
      lab.textContent = radRange+" 公里範圍 · 圖像 "+pad(t.getHours())+":"+pad(t.getMinutes())+" HKT · 每 6 分鐘更新";
    };
    img.src = "https://www.hko.gov.hk/wxinfo/radars/"+cfg.dir+"/"+cfg.pre+stamp(t)+".jpg";
  }
  tick();
}

function load(url, fn, tag){
  fetch(url, {cache:"no-store"}).then(r=>r.json()).then(j=>{
    fn(j); localStorage.setItem("hk_"+tag, JSON.stringify(j));
  }).catch(()=>{
    const c = localStorage.getItem("hk_"+tag);
    if(c) fn(JSON.parse(c));
  });
}
load(URL_NOW, renderNow, "now");
load(FND, renderFnd, "fnd");
loadRadar();
setInterval(()=>load(URL_NOW, renderNow, "now"), 300000);
setInterval(loadRadar, 360000);
</script>
</body>
</html>
